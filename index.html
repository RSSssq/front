<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=devicfe-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rossochka Gift</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ====== BASE ====== */
    :root {
      --bg: #060810;
      --bg2: #0c0f1a;
      --bg3: #10141f;
      --border: rgba(255,255,255,.07);
      --pink: #e83d7f;
      --pink2: #c2185b;
      --blue: #3b7cf4;
      --emerald: #22c55e;
      --amber: #f59e0b;
      --text: #f0f2ff;
      --muted: rgba(240,242,255,.45);
      --card: rgba(13,16,26,.96);
      color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(circle at 10% 0%, rgba(232,61,127,.18) 0%, transparent 28%),
        radial-gradient(circle at 90% 5%, rgba(59,124,244,.16) 0%, transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(34,197,94,.08) 0%, transparent 25%);
      pointer-events: none;
    }
    ::selection { background: rgba(232,61,127,.3); }
    .ff-display { font-family: 'Unbounded', sans-serif; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; color: inherit; }

    /* ====== ANIMATIONS ====== */
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes shimmer { from { background-position:-200% 0; } to { background-position:200% 0; } }
    @keyframes countUp { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
    @keyframes crashLine { from { stroke-dashoffset:1000; } to { stroke-dashoffset:0; } }
    .anim-fadeup { animation: fadeUp .32s ease both; }
    .anim-float { animation: float 4s ease-in-out infinite; }
    .anim-spin { animation: spin .8s linear infinite; }
    .anim-count { animation: countUp .2s ease both; }

    /* ====== LAYOUT ====== */
    #app { max-width: 760px; margin: 0 auto; padding: 12px 14px 100px; }
    .status-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      font-size: 12px; color: var(--muted); margin-bottom: 14px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 12px rgba(34,197,94,.7);
      animation: pulse 2s ease-in-out infinite;
    }

    /* ====== GLASS CARD ====== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }
    .card-p { padding: 20px; }
    .card-hover { transition: transform .18s, border-color .18s; }
    .card-hover:hover { transform: translateY(-2px); border-color: rgba(232,61,127,.22); }

    /* ====== HEADER ====== */
    .header { position: relative; overflow: hidden; }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 0%, rgba(232,61,127,.16), transparent 30%),
                  radial-gradient(circle at 85% 10%, rgba(59,124,244,.12), transparent 25%);
      pointer-events: none;
    }
    .header-inner { position: relative; }
    .avatar-wrap { position: relative; display: inline-block; }
    .avatar {
      width: 72px; height: 72px; border-radius: 22px;
      border: 1px solid var(--border); object-fit: cover;
      background: var(--bg3);
    }
    .avatar-online {
      position: absolute; bottom: -3px; right: -3px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--emerald);
      border: 2px solid var(--bg);
      box-shadow: 0 0 16px rgba(34,197,94,.6);
    }
    .level-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(232,61,127,.25);
      background: rgba(232,61,127,.1);
      font-size: 12px; font-weight: 700; color: #f4a7c3;
    }
    .exp-bar {
      height: 4px; border-radius: 99px;
      background: rgba(255,255,255,.08); overflow: hidden; margin-top: 8px;
    }
    .exp-fill {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--pink), var(--blue));
      transition: width .6s ease;
    }
    .stat-mini {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px 16px;
    }
    .stat-mini-label { font-size: 11px; color: var(--muted); }
    .stat-mini-val { font-size: 22px; font-weight: 900; line-height: 1.1; margin-top: 4px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }

    /* ====== BUTTONS ====== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 16px; font-size: 14px; font-weight: 700;
      transition: transform .12s, filter .12s, opacity .12s; cursor: pointer;
    }
    .btn:active { transform: scale(.97); }
    .btn-pink { background: linear-gradient(135deg, var(--pink), #a0145f); color: #fff; }
    .btn-blue { background: linear-gradient(135deg, var(--blue), #1a4fc7); color: #fff; }
    .btn-emerald { background: linear-gradient(135deg, var(--emerald), #16a34a); color: #fff; }
    .btn-ghost { background: rgba(255,255,255,.07); border: 1px solid var(--border); }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 12px; }
    .btn-full { width: 100%; }
    .btn-disabled { opacity: .45; pointer-events: none; }

    /* ====== NAV ====== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      border-top: 1px solid var(--border);
      background: rgba(6,8,16,.88);
      backdrop-filter: blur(20px);
      padding: 10px 12px max(10px, env(safe-area-inset-bottom));
    }
    .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 760px; margin: 0 auto; }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 4px; border-radius: 16px;
      font-size: 11px; font-weight: 600; color: var(--muted);
      transition: color .15s, background .15s;
    }
    .nav-item.active {
      background: rgba(232,61,127,.12);
      border: 1px solid rgba(232,61,127,.2);
      color: #f4a7c3;
      box-shadow: 0 0 20px rgba(232,61,127,.12);
    }
    .nav-icon { font-size: 20px; line-height: 1; }

    /* ====== SECTIONS ====== */
    .section-title { font-size: 18px; font-weight: 900; letter-spacing: -.4px; }
    .section-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* ====== REWARDS STRIP ====== */
    .rewards-strip {
      display: flex; gap: 10px; overflow-x: auto;
      padding-bottom: 6px; margin: 0 -2px;
    }
    .reward-chip {
      flex-shrink: 0; min-width: 110px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 20px; padding: 14px 12px;
      text-align: center;
    }
    .reward-chip .emoji { font-size: 28px; }
    .reward-chip .rname { font-size: 11px; color: var(--muted); margin-top: 8px; }
    .reward-chip .rval { font-size: 16px; font-weight: 900; margin-top: 2px; }

    /* ====== GAME CARDS ====== */
    .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .games-grid { grid-template-columns: 1fr; } }
    .game-card {
      border-radius: 22px; overflow: hidden; cursor: pointer;
      border: 1px solid var(--border);
      transition: transform .18s, border-color .18s;
      min-height: 200px; position: relative;
    }
    .game-card:active { transform: scale(.97); }
    .game-card:hover { border-color: rgba(232,61,127,.25); }
    .game-inner { position: relative; height: 100%; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .game-emoji { font-size: 64px; position: absolute; right: 16px; top: 50%; transform: translateY(-60%); opacity: .9; }
    .game-tag {
      display: inline-block; padding: 4px 10px; border-radius: 10px;
      font-size: 11px; font-weight: 700; background: rgba(255,255,255,.08);
    }
    .game-title { font-size: 28px; font-weight: 900; letter-spacing: -1px; }
    .game-desc { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .game-arrow {
      position: absolute; top: 16px; right: 16px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center;
    }

    /* ====== MODAL ====== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(12px);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 0;
    }
    @media (min-width: 500px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal-box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 28px 28px 0 0; width: 100%; max-width: 560px;
      padding: 24px 20px max(24px, env(safe-area-inset-bottom));
      max-height: 90vh; overflow-y: auto;
    }
    @media (min-width: 500px) { .modal-box { border-radius: 28px; max-height: 85vh; } }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,.15); margin: 0 auto 20px;
    }
    .modal-title { font-size: 22px; font-weight: 900; }

    /* ====== SPONSOR GATE ====== */
    .sponsor-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-radius: 18px;
      border: 1px solid var(--border); background: var(--bg3);
      margin-bottom: 10px; gap: 12px;
    }
    .sponsor-check { font-size: 18px; min-width: 26px; text-align: center; }

    /* ====== DAILY CASE ====== */
    .roulette-wrap {
      overflow: hidden; border-radius: 18px; border: 1px solid var(--border);
      background: rgba(0,0,0,.25); position: relative;
    }
    .roulette-indicator {
      position: absolute; top: 0; bottom: 0; left: 50%;
      width: 2px; background: var(--pink);
      box-shadow: 0 0 12px var(--pink); z-index: 2; transform: translateX(-50%);
    }
    .roulette-track { display: flex; gap: 8px; padding: 12px; transition: transform 2s cubic-bezier(.1,.7,.15,1); }
    .roulette-cell {
      flex-shrink: 0; width: 90px; border-radius: 14px;
      border: 1px solid var(--border); padding: 12px 8px; text-align: center;
    }
    .roulette-cell .emoji { font-size: 24px; }
    .roulette-cell .rname { font-size: 10px; color: var(--muted); margin-top: 6px; }
    .roulette-cell .rval { font-size: 13px; font-weight: 900; margin-top: 2px; }

    /* ====== CRASH GAME ====== */
    #crash-canvas { width: 100%; border-radius: 18px; display: block; }
    .crash-multiplier {
      font-size: 56px; font-weight: 900; text-align: center;
      font-family: 'Unbounded', sans-serif; letter-spacing: -2px;
      transition: color .2s;
    }
    .crash-state-running { color: var(--emerald); }
    .crash-state-crashed { color: var(--pink); }
    .crash-state-idle { color: var(--text); }

    /* ====== MINES ====== */
    .mines-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 8px; }
    .mine-cell {
      aspect-ratio: 1; border-radius: 14px; font-size: 22px;
      border: 1px solid var(--border); background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .1s, background .15s, border-color .15s;
    }
    .mine-cell:active { transform: scale(.93); }
    .mine-cell.safe { background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.3); }
    .mine-cell.mine { background: rgba(232,61,127,.15); border-color: rgba(232,61,127,.4); }
    .mine-cell.revealed { cursor: default; }
    .mine-cell.hidden:hover { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.05); }

    /* ====== UPGRADE ====== */
    .upgrade-visual {
      border-radius: 20px; padding: 24px; text-align: center;
      border: 1px solid var(--border); background: var(--bg3);
      margin: 16px 0; position: relative; overflow: hidden;
    }
    .upgrade-glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(232,61,127,.12), transparent 60%);
    }
    .upgrade-chance {
      font-size: 42px; font-weight: 900; font-family: 'Unbounded', sans-serif;
    }

    /* ====== WALLET ====== */
    .balance-big {
      font-size: 42px; font-weight: 900; letter-spacing: -2px;
      font-family: 'Unbounded', sans-serif;
    }
    .balance-big span { color: var(--emerald); }
    .tx-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-radius: 18px;
      border: 1px solid var(--border); background: var(--bg3);
      margin-bottom: 8px;
    }
    .tx-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .tx-deposit { background: rgba(34,197,94,.12); }
    .tx-withdraw { background: rgba(232,61,127,.12); }
    .tx-reward { background: rgba(59,124,244,.12); }

    /* ====== TOAST ====== */
    .toast {
      position: fixed; top: 16px; left: 50%; z-index: 200;
      transform: translateX(-50%);
      background: rgba(10,12,20,.95); border: 1px solid var(--border);
      border-radius: 99px; padding: 12px 20px;
      font-size: 13px; font-weight: 600;
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      animation: fadeUp .25s ease;
      white-space: nowrap; max-width: 90vw;
      overflow: hidden; text-overflow: ellipsis;
    }

    /* ====== LOADING ====== */
    .spinner { width: 28px; height: 28px; border: 2px solid rgba(255,255,255,.1); border-top-color: var(--pink); border-radius: 50%; }
    .loading-center { display: flex; align-items: center; justify-content: center; min-height: 180px; }

    /* ====== TASKS ====== */
    .task-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-radius: 18px;
      border: 1px solid var(--border); background: var(--bg3);
      margin-bottom: 8px; gap: 12px;
    }
    .task-icon { font-size: 24px; width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .task-name { font-size: 14px; font-weight: 700; }
    .task-reward { font-size: 12px; color: var(--muted); }

    /* ====== INPUT ====== */
    .inp {
      width: 100%; border-radius: 16px; border: 1px solid var(--border);
      background: var(--bg3); padding: 14px 16px;
      font-size: 15px; font-family: inherit; color: var(--text); outline: none;
    }
    .inp:focus { border-color: rgba(232,61,127,.4); }
    .inp::placeholder { color: var(--muted); }
    label.lbl { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; }

    /* ====== ADMIN PANEL ====== */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .admin-table th, .admin-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .admin-table th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .badge-pending { background: rgba(245,158,11,.15); color: var(--amber); }
    .badge-confirmed { background: rgba(34,197,94,.12); color: var(--emerald); }
    .badge-failed { background: rgba(232,61,127,.12); color: var(--pink); }
  </style>
</head>
<body>
<div id="app"><div class="loading-center"><div class="spinner anim-spin"></div></div></div>

<script>
// ============================================
// CONFIG — INSERT YOUR BACKEND URL
// ============================================
const API_URL = "https://exemplary-fascination-production-aa95.up.railway.app"; // INSERT BACKEND URL
const BOT_USERNAME = "Rossochka"; // INSERT BOT USERNAME

// ============================================
// TELEGRAM WEBAPP INIT
// ============================================
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#060810'); } catch {}
  try { tg.setBackgroundColor('#060810'); } catch {}
}

const initData = tg?.initData || "";
const tgUser = tg?.initDataUnsafe?.user || null;

function safeUsername(u) {
  if (!u) return "Игрок";
  if (u.username) return "@" + u.username;
  return (u.first_name || "") + (u.last_name ? " " + u.last_name : "") || "Игрок";
}
function avatarUrl(u) {
  return u?.photo_url || `https://api.dicebear.com/9.x/bottts-neutral/svg?seed=${encodeURIComponent(u?.username || u?.id || "r")}`;
}
function fmt(n, dec = 2) { return Number(n || 0).toFixed(dec); }
function now() { return Date.now(); }

// ============================================
// API CLIENT
// ============================================
async function api(method, path, body) {
  const opts = {
    method: method || "GET",
    headers: { "Content-Type": "application/json", "x-init-data": initData }
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API_URL + path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || "API error");
  }
  return r.json();
}

// ============================================
// STATE
// ============================================
const S = {
  tab: "home",
  profile: null,
  transactions: [],
  referrals: 0,
  sponsors: [],
  sponsorOk: false,
  modal: null,
  toast: null,
  loading: true,
  // crash
  crash: { state: "idle", gameId: null, multiplier: 1, crashAt: null, bet: "0.01", interval: null },
  // mines
  mines: { state: "idle", gameId: null, bet: "0.01", minesCount: 3, revealed: [], lastMines: null, multiplier: 1 },
  // upgrade
  upgrade: { bet: "0.01", target: 2, result: null },
  // case
  caseSpinning: false,
  caseResult: null,
  // wallet
  withdrawAmount: "", withdrawAddress: "",
  // admin
  adminView: false, adminUsers: [], adminTx: [], adminSponsors: [], adminStats: null
};

// ============================================
// INIT
// ============================================
async function init() {
  try {
    S.profile = await api("GET", "/api/me");
    // Handle referral from URL param
    const startParam = tg?.initDataUnsafe?.start_param;
    if (startParam && startParam.startsWith("ref_")) {
      const refId = startParam.replace("ref_", "");
      try { await api("POST", `/api/referral/${refId}`, {}); } catch {}
    }
    [S.referrals] = await Promise.all([
      api("GET", "/api/referrals").then(r => r.count).catch(() => 0)
    ]);
    S.loading = false;
  } catch (err) {
    // If no backend, run in demo mode
    S.profile = { tg_id: tgUser?.id || 0, username: tgUser?.username, first_name: tgUser?.first_name, balance_ton: 0.06, level: 1, exp: 12, next_exp: 100 };
    S.loading = false;
  }
  render();
}

// ============================================
// TOAST
// ============================================
function toast(msg, duration = 2200) {
  S.toast = { msg, id: Math.random() };
  render();
  setTimeout(() => { S.toast = null; render(); }, duration);
}

// ============================================
// MODAL
// ============================================
function openModal(name) { S.modal = name; render(); }
function closeModal() { S.modal = null; render(); }

// ============================================
// TAB
// ============================================
function setTab(tab) { S.tab = tab; render(); }

// ============================================
// CHECK SPONSORS
// ============================================
async function checkSponsors() {
  try {
    const r = await api("POST", "/api/check-subs", {});
    S.sponsors = r.channels || [];
    S.sponsorOk = r.ok;
    render();
    if (r.ok) { toast("✅ Подписка подтверждена!"); closeModal(); }
  } catch { toast("⚠️ Проверьте подписку и попробуйте снова"); }
}

// ============================================
// DAILY CASE
// ============================================
const REWARD_POOL = [
  { name:"Монетка", value:0.01, icon:"🪙" },
  { name:"Малый бонус", value:0.03, icon:"🎁" },
  { name:"Подарок", value:0.05, icon:"💝" },
  { name:"Раритет", value:0.15, icon:"💎" },
  { name:"Супер", value:0.50, icon:"🚀" },
  { name:"Джекпот", value:1.00, icon:"👑" }
];

async function openDailyCase() {
  if (S.caseSpinning) return;
  S.caseSpinning = true; S.caseResult = null; render();
  try {
    const r = await api("POST", "/api/daily", {});
    if (!r.ok) {
      if (r.cooldown_ms) {
        toast(`⏰ Следующий кейс через ${formatTime(r.cooldown_ms)}`);
      } else if (r.error === "not_subscribed") {
        toast(`📢 Подпишись на ${r.channel} для получения кейса`);
        openModal("sponsors");
      } else {
        toast(r.error || "Ошибка");
      }
      S.caseSpinning = false; render(); return;
    }
    // Animate roulette
    const track = document.getElementById("roulette-track");
    if (track) {
      const totalCells = track.children.length;
      const targetPct = 55 + Math.random() * 10;
      track.style.transform = `translateX(-${targetPct}%)`;
    }

// ============================================
// CRASH GAME
// ============================================
let crashAnimFrame = null;
let crashStartTime = null;

async function startCrash() {
  const bet = Number(S.crash.bet);
  if (!bet || bet <= 0) return toast("Укажи ставку");
  if (bet > Number(S.profile?.balance_ton)) return toast("Недостаточно баланса");
  try {
    const r = await api("POST", "/api/games/crash", { bet });
    S.crash = { ...S.crash, state: "running", gameId: r.game_id, crashAt: r.crash_at, multiplier: 1.00 };
    if (S.profile) S.profile.balance_ton = Number(S.profile.balance_ton) - bet;
    crashStartTime = performance.now();
    animateCrash();
    render();
  } catch (err) { toast(err.message); }
}

function animateCrash() {
  if (S.crash.state !== "running") return;
  const elapsed = (performance.now() - crashStartTime) / 1000;
  const mult = Math.max(1, Math.pow(Math.E, elapsed * 0.18));
  S.crash.multiplier = Number(mult.toFixed(2));
  drawCrashCanvas();

  if (mult >= S.crash.crashAt) {
    S.crash.state = "crashed";
    S.crash.multiplier = S.crash.crashAt;
    render();
    toast(`💥 Краш на x${S.crash.crashAt}!`);
    setTimeout(() => { S.crash = { ...S.crash, state: "idle", gameId: null }; render(); }, 3000);
    return;
  }
  // Update multiplier display only (not full re-render for perf)
  const el = document.getElementById("crash-mult");
  if (el) el.textContent = `x${S.crash.multiplier}`;
  crashAnimFrame = requestAnimationFrame(animateCrash);
}

async function cashoutCrash() {
  if (S.crash.state !== "running") return;
  cancelAnimationFrame(crashAnimFrame);
  try {
    const r = await api("POST", `/api/games/crash/${S.crash.gameId}/cashout`, { multiplier: S.crash.multiplier });
    if (r.ok) {
      if (S.profile) S.profile.balance_ton = Number(S.profile.balance_ton) + Number(r.payout);
      toast(`💰 Кэшаут x${S.crash.multiplier} = +${fmt(r.profit)} TON`);
      S.crash = { ...S.crash, state: "idle", gameId: null };
      render();
    }
  } catch (err) { toast(err.message); }
}

function drawCrashCanvas() {
  const canvas = document.getElementById("crash-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(10,12,20,0)";
  ctx.fillRect(0, 0, W, H);

  const elapsed = (performance.now() - crashStartTime) / 1000;
  const points = [];
  for (let t = 0; t <= elapsed; t += 0.05) {
    const m = Math.pow(Math.E, t * 0.18);
    const x = (t / elapsed) * W;
    const y = H - ((m - 1) / (S.crash.multiplier - 1 || 1)) * (H * 0.8);
    points.push([x, y]);
  }
  if (points.length < 2) return;

  const grad = ctx.createLinearGradient(0, H, W, 0);
  grad.addColorStop(0, "rgba(34,197,94,.3)");
  grad.addColorStop(1, "rgba(34,197,94,.05)");

  ctx.beginPath();
  ctx.moveTo(0, H);
  points.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(points[points.length-1][0], H);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 2.5;
  ctx.shadowColor = "#22c55e";
  ctx.shadowBlur = 10;
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.stroke();
}

async function revealCell(cell) {
  if (S.mines.state !== "running") return;
  if (S.mines.revealed.includes(cell)) return;
  try {
    const r = await api("POST", `/api/games/mines/${S.mines.gameId}/reveal`, { cell });
    S.mines.revealed = [...S.mines.revealed, cell];
    if (r.mine) {
      S.mines.state = "lost";
      S.mines.lastMines = r.mines;
      toast("💥 Бомба! Ты проиграл");
      render(); return;
    }
    S.mines.multiplier = r.multiplier || 1;
    if (r.state === "won") {
      S.mines.state = "won";
      if (S.profile) S.profile.balance_ton = Number(S.profile.balance_ton) + Number(r.payout);
      toast(`🎉 Победа! +${fmt(r.payout)} TON`);
    }
    render();
  } catch (err) { toast(err.message); }
}

async function cashoutMines() {
  if (S.mines.state !== "running") return;
  try {
    const r = await api("POST", `/api/games/mines/${S.mines.gameId}/cashout`, {});
    if (r.ok) {
      if (S.profile) S.profile.balance_ton = Number(S.profile.balance_ton) + Number(r.payout);

// ============================================
function formatTime(ms) {
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast("Скопировано!")).catch(() => toast("Не удалось скопировать"));
}

// ============================================
window.confirmTx = async function(id, status) {
  await fetch(`${API_URL}/api/admin/transactions/${id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json","x-admin-token":S.adminToken},
    body: JSON.stringify({status})
  });
  S.adminTx = S.adminTx.map(t => t.id === id ? {...t, status} : t);
  render();
};

window.toggleSponsor = async function(id, active) {
  await fetch(`${API_URL}/api/admin/sponsors/${id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json","x-admin-token":S.adminToken},
    body: JSON.stringify({is_active: active})
  });
  S.adminSponsors = S.adminSponsors.map(s => s.id === id ? {...s, is_active: active} : s);
  render();
};

window.deleteSponsor = async function(id) {
  if (!confirm("Удалить спонсора?")) return;
  await fetch(`${API_URL}/api/admin/sponsors/${id}`, {
    method:"DELETE", headers:{"x-admin-token":S.adminToken}
  });
  S.adminSponsors = S.adminSponsors.filter(s => s.id !== id);
  render();
};

// ============================================
// EVENT BINDING
// ============================================
function bindEvents() {
  // Nav tabs
  document.querySelectorAll("[data-tab]").forEach(el => {
    el.onclick = () => { S.activeGame = null; setTab(el.dataset.tab); };
  });

  // Sponsors modal
  const openSponsors = document.getElementById("open-sponsors");
  const checkSubs = document.getElementById("check-subs");
  const checkSubsCase = document.getElementById("check-subs-case");
  if (openSponsors) openSponsors.onclick = () => { checkSponsors(); openModal("sponsors"); };
  if (checkSubs) checkSubs.onclick = () => { checkSponsors(); openModal("sponsors"); };
  if (checkSubsCase) checkSubsCase.onclick = () => openModal("sponsors");

  const closeModalBtn = document.getElementById("close-modal");
  const modalOverlay = document.getElementById("modal-overlay");
  if (closeModalBtn) closeModalBtn.onclick = closeModal;
  if (modalOverlay) modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

  const verifySubs = document.getElementById("verify-subs");
  if (verifySubs) verifySubs.onclick = checkSponsors;

  // Quick nav
  const goCases = document.getElementById("go-cases");
  const goGames = document.getElementById("go-games");
  if (goCases) goCases.onclick = () => setTab("cases");
  if (goGames) goGames.onclick = () => setTab("games");

  // Copy ref
  const copyRef = document.getElementById("copy-ref");
  const copyRefProfile = document.getElementById("copy-ref-profile");
  const refLink = `https://t.me/${BOT_USERNAME}?start=ref_${S.profile?.tg_id || "demo"}`;
  if (copyRef) copyRef.onclick = () => copyText(refLink);
  if (copyRefProfile) copyRefProfile.onclick = () => copyText(refLink);

  // Case
  const openCase = document.getElementById("open-case");
  if (openCase) openCase.onclick = () => {
    S.caseResult = null;
    const track = document.getElementById("roulette-track");
    if (track) track.style.transition = "none", track.style.transform = "translateX(0%)";
    setTimeout(() => { if (track) track.style.transition = ""; }, 50);
    openDailyCase();
  };
  const closeCaseResult = document.getElementById("close-case-result");
  if (closeCaseResult) closeCaseResult.onclick = () => { S.caseResult = null; closeModal(); render(); };
  if (S.caseResult && S.modal !== "case-result") openModal("case-result");

  // Crash
  const crashStart = document.getElementById("crash-start");
  const crashCashout = document.getElementById("crash-cashout");
  const crashBet = document.getElementById("crash-bet");
  const backGames = document.getElementById("back-games");
  if (crashBet) crashBet.oninput = (e) => S.crash.bet = e.target.value;
  if (crashStart) crashStart.onclick = startCrash;
  if (crashCashout) crashCashout.onclick = cashoutCrash;
  if (backGames) backGames.onclick = () => { S.activeGame = null; cancelAnimationFrame(crashAnimFrame); render(); };

  // Mines
  const minesBet = document.getElementById("mines-bet");
  const minesCount = document.getElementById("mines-count");
  const minesStart = document.getElementById("mines-start");
  const minesCashout = document.getElementById("mines-cashout");
  const minesReset = document.getElementById("mines-reset");
  if (minesBet) minesBet.oninput = (e) => S.mines.bet = e.target.value;
  if (minesCount) minesCount.oninput = (e) => S.mines.minesCount = Number(e.target.value);
  if (minesStart) minesStart.onclick = startMines;
  if (minesCashout) minesCashout.onclick = cashoutMines;
  if (minesReset) minesReset.onclick = () => { S.mines = { ...S.mines, state:"idle", gameId:null, revealed:[], lastMines:null, multiplier:1 }; render(); };
  document.querySelectorAll(".mine-cell.hidden").forEach(cell => {
    cell.onclick = () => revealCell(Number(cell.dataset.cell));
  });

  // Upgrade
  const upgradeBet = document.getElementById("upgrade-bet");
  const upgradeTarget = document.getElementById("upgrade-target");
  const upgradePlay = document.getElementById("upgrade-play");
  if (upgradeBet) upgradeBet.oninput = (e) => { S.upgrade.bet = e.target.value; render(); };
  if (upgradeTarget) upgradeTarget.oninput = (e) => { S.upgrade.target = Number(e.target.value); S.upgrade.result = null; render(); };
  if (upgradePlay) upgradePlay.onclick = playUpgrade;

  // Game cards
  document.querySelectorAll("[data-game]").forEach(card => {
    card.onclick = () => { S.activeGame = card.dataset.game; render(); };
  });

  // Wallet
  const walletWithdrawOpen = document.getElementById("wallet-withdraw-open");
  const form = document.getElementById("withdraw-form");
  if (walletWithdrawOpen && form) {
    walletWithdrawOpen.onclick = () => { form.style.display = form.style.display === "none" ? "block" : "none"; };
  }
  const loadTx = document.getElementById("load-tx");
  if (loadTx) loadTx.onclick = loadTransactions;
  const withdrawAddr = document.getElementById("withdraw-addr");
  const withdrawAmt = document.getElementById("withdraw-amount");
  const doWithdraw = document.getElementById("do-withdraw");
  if (withdrawAddr) withdrawAddr.oninput = (e) => S.withdrawAddress = e.target.value;
  if (withdrawAmt) withdrawAmt.oninput = (e) => S.withdrawAmount = e.target.value;
  if (doWithdraw) doWithdraw.onclick = withdraw;

  // Profile
  const refreshProfile = document.getElementById("refresh-profile");
  const openAdmin = document.getElementById("open-admin");
  if (refreshProfile) refreshProfile.onclick = async () => {
    try { S.profile = await api("GET", "/api/me"); render(); toast("Профиль обновлён"); } catch { toast("Ошибка"); }
  };
  if (openAdmin) openAdmin.onclick = () => loadAdmin();
  const addSponsor = document.getElementById("add-sponsor");
  if (addSponsor) addSponsor.onclick = async () => {
    const channel_id = prompt("Channel ID (number):");
    const title = prompt("Title:");
    const link = prompt("Link:");
    if (!channel_id || !title || !link) return;
    await fetch(`${API_URL}/api/admin/sponsors`, {
      method:"POST", headers:{"Content-Type":"application/json","x-admin-token":S.adminToken},
      body: JSON.stringify({channel_id: Number(channel_id), title, link})
    });
    S.adminSponsors = await fetch(`${API_URL}/api/admin/sponsors`, { headers:{"x-admin-token":S.adminToken} }).then(r=>r.json());
    render();
  };

  // Draw crash canvas if game tab
  if (S.activeGame === "crash" && S.crash.state !== "idle") {
    const canvas = document.getElementById("crash-canvas");
    if (canvas) drawCrashCanvas();
  }
}

// ============================================
// START APP
// ============================================
init();
</script>
</body>
</html>
